        async function deleteProject(id) {
            const target = projects.find(p => p.id === id);
            if (!target) return;

            const allTargetIds = getAllDescendantProjectIds(id);
            const msg = allTargetIds.length > 1 
                ? `"${target.name}" 폴더와 하위 폴더(${allTargetIds.length - 1}개) 및 모든 이미지를 클라우드에서 삭제하시겠습니까?`
                : `"${target.name}" 폴더를 삭제하시겠습니까?`;

            if (confirm(msg)) {
                // 배치 삭제
                const batch = db.batch();
                allTargetIds.forEach(pId => {
                    batch.delete(db.collection('projects').doc(pId));
                });
                const itemsToDelete = allItems.filter(it => allTargetIds.includes(it.projectId));
                itemsToDelete.forEach(it => {
                    batch.delete(db.collection('items').doc(it.id));
                });
                await batch.commit();

                if (allTargetIds.includes(currentProjectId)) {
                    currentProjectId = projects.find(p => !allTargetIds.includes(p.id))?.id || 'proj-mobility';
                }
                showToast("폴더가 삭제되었습니다.");
            }
        }

        function setupPasteListener() {
            window.addEventListener('paste', async (e) => {
                const clipboardData = e.clipboardData || window.clipboardData;
                if (!clipboardData) return;

                const itemsList = clipboardData.items;
                let foundImage = false;

                if (itemsList) {
                    for (let i = 0; i < itemsList.length; i++) {
                        if (itemsList[i].type.indexOf('image') !== -1) {
                            const blob = itemsList[i].getAsFile();
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                addNewItem({
                                    projectId: currentProjectId,
                                    src: event.target.result
                                });
                            };
                            reader.readAsDataURL(blob);
                            foundImage = true;
                            break;
                        }
                    }
                }

                // 웹페이지 URL 또는 이미지 주소 텍스트 복사 붙여넣기 처리
                if (!foundImage) {
                    const textData = clipboardData.getData('text/plain');
                    if (textData && (textData.trim().startsWith('http://') || textData.trim().startsWith('https://'))) {
                        fetchUrlAndAddSquareItem(textData.trim());
                    }
                }
            });
        }

        // URL로부터 대표 이미지(OG Image) 추출 후 1:1 정사각형 썸네일로 추가하는 공통 함수
        async function fetchUrlAndAddSquareItem(targetUrl) {
            showToast("🔍 대표 이미지를 추출하는 중...");

            // 이미지 파일 직접 링크인 경우 (.jpg, .png, .webp, .svg 등)
            if (/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i.test(targetUrl)) {
                addNewItem({
                    projectId: currentProjectId,
                    src: targetUrl,
                    url: targetUrl,
                    isSquare: true
                });
                return;
            }

            // 웹페이지 URL인 경우: OpenGraph 메타데이터 API를 통해 대표 이미지 추출
            try {
                const apiUrl = `https://api.microlink.io?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'success' && data.data && data.data.image && data.data.image.url) {
                    addNewItem({
                        projectId: currentProjectId,
                        src: data.data.image.url,
                        url: targetUrl,
                        isSquare: true
                    });
                } else {
                    // 폴백: 웹사이트 실시간 캡처 스크린샷 썸네일
                    const fallbackScreenshot = `https://s0.wp.com/mshots/v1/${encodeURIComponent(targetUrl)}?w=800`;
                    addNewItem({
                        projectId: currentProjectId,
                        src: fallbackScreenshot,
                        url: targetUrl,
                        isSquare: true
                    });
                }
            } catch (err) {
                console.warn("URL extraction fallback to screenshot:", err);
                const fallbackScreenshot = `https://s0.wp.com/mshots/v1/${encodeURIComponent(targetUrl)}?w=800`;
                addNewItem({
                    projectId: currentProjectId,
                    src: fallbackScreenshot,
                    url: targetUrl,
                    isSquare: true
                });
            }
        }

        // 이미지를 특정 폴더로 이동시키는 공통 함수 (단일 또는 다중 선택 일괄 이동)
        async function moveItemToFolder(itemId, targetFolderId) {
            if (!targetFolderId) return;
            const targetProj = projects.find(p => p.id === targetFolderId);
            const targetName = targetProj ? targetProj.name : '해당 폴더';

            let itemsToMove = [];
            if (isSelectionMode && selectedItemIds.has(itemId)) {
                itemsToMove = Array.from(selectedItemIds);
            } else {
                itemsToMove = [itemId];
            }

            // 이동할 대상 중 이미 해당 폴더에 있는 것 제외
            const validItemsToMove = itemsToMove.filter(id => {
                const item = allItems.find(it => it.id === id);
                return item && item.projectId !== targetFolderId;
            });

            if (validItemsToMove.length === 0) {
                showToast(`이미 [${targetName}]에 있는 이미지입니다.`);
                return;
            }

            const batch = db.batch();
            validItemsToMove.forEach(id => {
                batch.update(db.collection('items').doc(id), {
                    projectId: targetFolderId,
                    previousProjectId: firebase.firestore.FieldValue.delete()
                });
            });

            try {
                await batch.commit();
                if (isSelectionMode) {
                    selectedItemIds.clear();
                    toggleSelectMode(false);
                }
                showToast(`선택한 ${validItemsToMove.length}개의 이미지를 [${targetName}] 폴더로 이동했습니다.`);
            } catch (err) {
                console.error("폴더 이동 오류:", err);
                showToast("폴더 이동 중 오류가 발생했습니다.");
            }
        }

        let draggedItemId = null;

        function getBaseGridSize() {
            try {
                const saved = localStorage.getItem('moodboard_apple_size');
                if (saved) return parseInt(saved, 10);
            } catch {}
            const slider = document.getElementById('sizeSlider');
            return slider ? parseInt(slider.value, 10) : 280;
        }

        function renderGrid() {
            const grid = document.getElementById('masonryGrid');
            const empty = document.getElementById('emptyState');
            if (!grid) return;
            grid.innerHTML = '';

            // order 기준 정렬 (없으면 createdAt 기준)
            allItems.sort((a, b) => {
                if (a.order !== undefined && b.order !== undefined) {
                    return a.order - b.order;
                }
                const timeA = a.createdAt?.seconds || 0;
                const timeB = b.createdAt?.seconds || 0;
                return timeB - timeA;
            });

            const isTrashView = currentProjectId === 'trash';
            let currentItems;
            if (isTrashView) {
                currentItems = allItems.filter(it => it.projectId === 'trash');
            } else {
                const visibleProjectIds = getAllDescendantProjectIds(currentProjectId);
                currentItems = allItems.filter(it => it.projectId !== 'trash' && visibleProjectIds.includes(it.projectId));
            }
            
            const countEl = document.getElementById('imageCount');
            if (countEl) countEl.innerText = `${currentItems.length}`;

            if (currentItems.length === 0) {
                if (empty) empty.style.display = 'flex';
                if (pckry) {
                    pckry.destroy();
                    pckry = null;
                }
                return;
            }

            if (empty) empty.style.display = 'none';

            const baseWidth = getBaseGridSize();

            currentItems.forEach(item => {
                const card = document.createElement('div');
                const isSelected = selectedItemIds.has(item.id);
                card.className = `board-item ${isSelectionMode ? 'selectable' : ''} ${isSelected ? 'selected' : ''}`;
                card.setAttribute('data-id', item.id);
                
                // 상단 슬라이더 기준 크기 및 개별 확대 비율 적용
                let cardWidth = baseWidth;
                if (item.customScale) {
                    cardWidth = Math.round(baseWidth * item.customScale);
                } else if (item.width) {
                    cardWidth = item.width;
                }
                card.style.width = cardWidth + 'px';
                
                // 선택 모드 또는 공유 모드가 아닐 때만 드래그 앤 드롭 정렬 허용
                if (!isSelectionMode && !isShareMode && !isTrashView) {
                    card.setAttribute('draggable', 'true');

                    card.addEventListener('dragstart', (e) => {
                        draggedItemId = item.id;
                        card.classList.add('is-dragging');
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', item.id);
                    });

                    card.addEventListener('dragend', () => {
                        draggedItemId = null;
                        document.querySelectorAll('.board-item').forEach(el => {
                            el.classList.remove('is-dragging', 'drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');
                        });
                    });

                    card.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (!draggedItemId || draggedItemId === item.id) return;
                        e.dataTransfer.dropEffect = 'move';

                        const rect = card.getBoundingClientRect();
                        const relX = (e.clientX - rect.left) / rect.width;

                        card.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');

                        if (relX < 0.5) {
                            card.classList.add('drag-over-left');
                        } else {
                            card.classList.add('drag-over-right');
                        }
                    });

                    card.addEventListener('dragleave', () => {
                        card.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');
                    });

                    card.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        card.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');

                        if (!draggedItemId || draggedItemId === item.id) return;

                        const rect = card.getBoundingClientRect();
                        const relX = (e.clientX - rect.left) / rect.width;
                        const isInsertBefore = relX < 0.5;

                        await handleItemReorder(draggedItemId, item.id, isInsertBefore);
                    });
                }

                card.onclick = (e) => {
                    if (isResizingJustFinished) return;
                    if (isSelectionMode) {
                        toggleItemSelection(item.id);
                    } else {
                        openLightbox(item.id);
                    }
                };

                const isSquareItem = item.isSquare === true;

                let hostName = '';
                if (item.url && item.url.startsWith('http')) {
                    try {
                        hostName = new URL(item.url).hostname.replace('www.', '');
                    } catch {}
                }

                card.innerHTML = `
                    <div class="select-checkbox"></div>
                    <div class="img-wrapper ${isSquareItem ? 'is-square' : ''}">
                        <img src="${item.src}" alt="Visual" loading="lazy">
                        ${!isSelectionMode ? `
                            <div class="card-actions" onclick="event.stopPropagation()">
                                ${isTrashView ? `
                                    <button class="glass-icon-btn" title="원래 폴더로 복구" onclick="restoreItem('${item.id}')" style="color: #30d158;">
                                        <i data-lucide="rotate-ccw" style="width: 13px; height: 13px;"></i>
                                    </button>
                                    <button class="glass-icon-btn danger" title="영구 삭제 (복구 불가)" onclick="purgeItem('${item.id}')">
                                        <i data-lucide="trash-2" style="width: 13px; height: 13px;"></i>
                                    </button>
                                ` : `
                                    ${!isShareMode ? `
                                        <button class="glass-icon-btn" title="${item.url ? 'URL 수정: ' + item.url : 'URL 추가'}" onclick="editItemUrl('${item.id}')">
                                            <i data-lucide="${item.url ? 'link-2' : 'link'}" style="width: 13px; height: 13px; color: ${item.url ? '#2997ff' : '#fff'};"></i>
                                        </button>
                                    ` : ''}
                                    <button class="glass-icon-btn" title="다운로드" onclick="downloadImage('${item.src}')">
                                        <i data-lucide="download" style="width: 13px; height: 13px;"></i>
                                    </button>
                                    ${!isShareMode ? `
                                        <button class="glass-icon-btn danger" title="휴지통으로 이동" onclick="deleteItem('${item.id}')">
                                            <i data-lucide="trash-2" style="width: 13px; height: 13px;"></i>
                                        </button>
                                    ` : ''}
                                `}
                            </div>
                            ${hostName ? `
                                <div class="card-url-tag" onclick="event.stopPropagation(); window.open('${item.url}', '_blank');" title="사이트로 이동: ${item.url}">
                                    <i data-lucide="external-link" style="width: 10px; height: 10px;"></i>
                                    <span>${hostName}</span>
                                </div>
                            ` : ''}
                            ${!isShareMode && !isTrashView ? `
                                <div class="resize-handle" title="모서리를 드래그하여 원하는 크기로 자유롭게 조절 (주변 이미지가 자석처럼 밀착)" onmousedown="startCardResize(event, '${item.id}')" onclick="event.stopPropagation()"></div>
                            ` : ''}
                        ` : ''}
                    </div>
                `;

                grid.appendChild(card);
            });

            lucide.createIcons();

            // Packery 테트리스 자석 밀착 엔진 초기화 및 레이아웃
            if (pckry) {
                pckry.destroy();
            }
            pckry = new Packery(grid, {
                itemSelector: '.board-item',
                gutter: 16,
                percentPosition: false,
                transitionDuration: '0.2s'
            });

            if (window.imagesLoaded) {
                imagesLoaded(grid).on('progress', () => {
                    if (pckry) pckry.layout();
                });
            }
        }

        // --- Packery 기반 픽셀 단위 자유 마우스 드래그 크기 조절 (자석 테트리스 밀착) ---
        let activeResizingItemId = null;
        let isResizingJustFinished = false;

        function startCardResize(e, itemId) {
            e.preventDefault();
            e.stopPropagation();

            const card = document.querySelector(`.board-item[data-id="${itemId}"]`);
            if (!card) return;

            const item = allItems.find(it => it.id === itemId);
            if (!item) return;

            activeResizingItemId = itemId;
            card.classList.add('is-resizing');

            const wasDraggable = card.getAttribute('draggable');
            card.removeAttribute('draggable');

            const startX = e.clientX;
            const startWidth = card.getBoundingClientRect().width;
            let currentWidth = Math.round(startWidth);

            // 툴팁 생성
            let tooltip = card.querySelector('.resize-tooltip');
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.className = 'resize-tooltip';
                card.appendChild(tooltip);
            }
            tooltip.innerText = `${currentWidth}px`;

            function onMouseMove(moveEvent) {
                moveEvent.preventDefault();
                const deltaX = moveEvent.clientX - startX;
                currentWidth = Math.max(160, Math.min(900, Math.round(startWidth + deltaX)));
                
                card.style.width = currentWidth + 'px';
                tooltip.innerText = `${currentWidth}px`;

                // 실시간으로 주변 이미지들이 빈자리를 찾아 자석처럼 달라붙도록 Packery 재배치
                if (pckry) {
                    pckry.layout();
                }
            }

            async function onMouseUp(upEvent) {
                if (upEvent) {
                    upEvent.preventDefault();
                    upEvent.stopPropagation();
                }
                window.removeEventListener('mousemove', onMouseMove, true);
                window.removeEventListener('mouseup', onMouseUp, true);

                card.classList.remove('is-resizing');
                if (wasDraggable) {
                    card.setAttribute('draggable', wasDraggable);
                }
                if (tooltip && tooltip.parentNode) {
                    tooltip.parentNode.removeChild(tooltip);
                }
                activeResizingItemId = null;

                // 드래그 직후 클릭 라이트박스 오픈 방지
                isResizingJustFinished = true;
                setTimeout(() => {
                    isResizingJustFinished = false;
                }, 250);

                // 로컬 및 Firestore에 변경된 너비 및 배율 저장
                const baseWidth = getBaseGridSize();
                const customScale = parseFloat((currentWidth / baseWidth).toFixed(2));
                item.width = currentWidth;
                item.customScale = customScale;
                if (pckry) pckry.layout();

                try {
                    await db.collection('items').doc(itemId).update({
                        width: currentWidth,
                        customScale: customScale
                    });
                    showToast(`${currentWidth}px 크기로 저장되었습니다.`);
                } catch (err) {
                    console.error("Resize save error:", err);
                }
            }

            window.addEventListener('mousemove', onMouseMove, true);
            window.addEventListener('mouseup', onMouseUp, true);
        }

        // 이미지 드래그 앤 드롭 순서 변경 처리
        async function handleItemReorder(sourceId, targetId, isInsertBefore) {
            const sourceIndex = allItems.findIndex(it => it.id === sourceId);
            const targetIndex = allItems.findIndex(it => it.id === targetId);
            if (sourceIndex === -1 || targetIndex === -1) return;

            const [movedItem] = allItems.splice(sourceIndex, 1);
            
            const newTargetIndex = allItems.findIndex(it => it.id === targetId);
            const insertIndex = isInsertBefore ? newTargetIndex : newTargetIndex + 1;
            allItems.splice(insertIndex, 0, movedItem);

            // 전체 순서 order 부여
            allItems.forEach((it, idx) => {
                it.order = idx;
            });

            renderGrid();

            // Firestore에 변경된 순서 저장
            try {
                const batch = db.batch();
                allItems.forEach(it => {
                    batch.set(db.collection('items').doc(it.id), {
                        order: it.order
                    }, { merge: true });
                });
                await batch.commit();
                showToast("이미지 순서가 변경되었습니다.");
            } catch (err) {
                console.warn("Item reorder save error:", err);
            }
        }

        // 휴지통으로 이동 (소프트 딜리트 - 7일 보관)
        async function deleteItem(id) {
            const itemToDelete = allItems.find(it => it.id === id);
            if (!itemToDelete) return;

            try {
                await db.collection('items').doc(id).update({
                    deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    previousProjectId: itemToDelete.projectId,
                    projectId: 'trash'
                });
                showToast("🗑️ 휴지통으로 이동되었습니다 (7일 보관)");
            } catch (err) {
                console.error("Delete to trash error:", err);
            }
        }

        // 휴지통에서 원래 폴더로 복구
        async function restoreItem(id) {
            const item = allItems.find(it => it.id === id);
            if (!item) return;

            const targetProjectId = item.previousProjectId && projects.some(p => p.id === item.previousProjectId) 
                ? item.previousProjectId 
                : (projects[0]?.id || 'proj-mobility');

            try {
                await db.collection('items').doc(id).update({
                    deletedAt: firebase.firestore.FieldValue.delete(),
                    previousProjectId: firebase.firestore.FieldValue.delete(),
                    projectId: targetProjectId
                });
                showToast("↩️ 원래 폴더로 복구되었습니다.");
            } catch (err) {
                console.error("Restore error:", err);
            }
        }

        // 휴지통에서 영구 삭제 (완전 삭제)
        async function purgeItem(id) {
            if (!confirm("이 이미지를 영구적으로 삭제하시겠습니까? 복구할 수 없습니다.")) return;
            try {
                await db.collection('items').doc(id).delete();
                showToast("영구 삭제되었습니다.");
            } catch (err) {
                console.error("Purge error:", err);
            }
        }

        // 휴지통 전체 비우기
        async function emptyTrashCan() {
            const trashItems = allItems.filter(it => it.projectId === 'trash');
            if (trashItems.length === 0) {
                showToast("휴지통이 이미 비어 있습니다.");
                return;
            }

            if (!confirm(`휴지통의 이미지 ${trashItems.length}개를 모두 영구 삭제하시겠습니까?`)) return;

            const batch = db.batch();
            trashItems.forEach(it => {
                batch.delete(db.collection('items').doc(it.id));
            });

            await batch.commit();
            showToast("휴지통을 모두 비웠습니다.");
        }

        // 7일 지난 휴지통 항목 자동 영구 삭제 (1주일 보관 후 자동 폐기)
        async function cleanUpOldTrashItems() {
            const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const trashItems = allItems.filter(it => it.projectId === 'trash');

            const expiredItems = trashItems.filter(it => {
                if (!it.deletedAt) return false;
                const deleteTime = it.deletedAt.seconds ? it.deletedAt.seconds * 1000 : new Date(it.deletedAt).getTime();
                return (now - deleteTime) > SEVEN_DAYS_MS;
            });

            if (expiredItems.length > 0) {
                const batch = db.batch();
                expiredItems.forEach(it => {
                    batch.delete(db.collection('items').doc(it.id));
                });
                try {
                    await batch.commit();
                    console.log(`[휴지통] 7일 경과 항목 ${expiredItems.length}개 자동 정리 완료`);
                } catch (err) {
                    console.warn("Auto cleanup trash error:", err);
                }
            }
        }

        function toggleSelectMode(enable) {
            isSelectionMode = enable;
            selectedItemIds.clear();

            const normalCtrl = document.getElementById('normalControls');
            const selectCtrl = document.getElementById('selectionControls');
            const grid = document.getElementById('masonryGrid');

            if (isSelectionMode) {
                normalCtrl.style.display = 'none';
                selectCtrl.style.display = 'flex';
                grid.classList.add('selection-mode');
            } else {
                normalCtrl.style.display = 'flex';
                selectCtrl.style.display = 'none';
                grid.classList.remove('selection-mode');
            }

            updateSelectedCount();
            renderGrid();
        }

        function toggleItemSelection(id) {
            if (selectedItemIds.has(id)) {
                selectedItemIds.delete(id);
            } else {
                selectedItemIds.add(id);
            }
            updateSelectedCount();
            const card = document.querySelector(`[data-id="${id}"]`);
            if (card) {
                card.classList.toggle('selected', selectedItemIds.has(id));
            }
        }

        function toggleSelectAll() {
            const isTrashView = currentProjectId === 'trash';
            const visibleProjectIds = isTrashView ? ['trash'] : getAllDescendantProjectIds(currentProjectId);
            const currentItems = allItems.filter(it => visibleProjectIds.includes(it.projectId));

            if (selectedItemIds.size === currentItems.length) {
                selectedItemIds.clear();
            } else {
                currentItems.forEach(it => selectedItemIds.add(it.id));
            }
            updateSelectedCount();
            renderGrid();
        }

        function updateSelectedCount() {
            const countText = document.getElementById('selectedCountText');
            if (countText) {
                countText.innerText = `${selectedItemIds.size}개 선택됨`;
            }
        }

        async function deleteSelectedItems() {
            if (selectedItemIds.size === 0) {
                showToast("삭제할 이미지를 선택해주세요.");
                return;
            }

            const count = selectedItemIds.size;
            const batch = db.batch();
            const isTrashView = currentProjectId === 'trash';

            selectedItemIds.forEach(id => {
                if (isTrashView) {
                    batch.delete(db.collection('items').doc(id));
                } else {
                    const item = allItems.find(it => it.id === id);
                    batch.update(db.collection('items').doc(id), {
                        deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        previousProjectId: item?.projectId || currentProjectId,
                        projectId: 'trash'
                    });
                }
            });

            await batch.commit();
            selectedItemIds.clear();
            toggleSelectMode(false);
            showToast(isTrashView ? `${count}개 이미지가 영구 삭제되었습니다.` : `${count}개 이미지가 휴지통으로 이동되었습니다.`);
        }

        function setupUndoListener() {
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
                    e.preventDefault();
                    performUndo();
                }
            });
        }

        async function performUndo() {
            if (undoStack.length === 0) {
                showToast("실행 취소할 작업이 없습니다.");
                return;
            }

            const lastAction = undoStack.pop();
            if (lastAction.type === 'add') {
                await db.collection('items').doc(lastAction.itemId).delete();
                showToast("↩️ 실행 취소됨");
            } else if (lastAction.type === 'delete') {
                const item = lastAction.item;
                const docData = { ...item };
                delete docData.id;
                await db.collection('items').doc(item.id).set(docData);
                showToast("↩️ 삭제 복구됨");
            }
        }

        function handleFileUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    addNewItem({
                        projectId: currentProjectId,
                        src: event.target.result
                    });
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function downloadImage(src) {
            const a = document.createElement('a');
            a.href = src;
            a.download = `reference-${Date.now()}.png`;
            a.click();
        }

        function openLightbox(id) {
            const visibleProjectIds = getAllDescendantProjectIds(currentProjectId);
            const currentItems = allItems.filter(it => visibleProjectIds.includes(it.projectId));
            const index = currentItems.findIndex(it => it.id === id);
            if (index === -1) return;

            currentLightboxIndex = index;
            updateLightboxDisplay();

            const modal = document.getElementById('lightboxModal');
            modal.classList.add('active');
            lucide.createIcons();
        }

        function updateLightboxDisplay() {
            const visibleProjectIds = getAllDescendantProjectIds(currentProjectId);
            const currentItems = allItems.filter(it => visibleProjectIds.includes(it.projectId));
            if (currentItems.length === 0) {
                closeLightboxDirect();
                return;
            }

            const item = currentItems[currentLightboxIndex];
            const img = document.getElementById('lightboxImg');
            const counter = document.getElementById('lightboxCounter');
            const btnPrev = document.getElementById('btnPrevImg');
            const btnNext = document.getElementById('btnNextImg');

            img.style.opacity = '0.4';
            img.style.transform = 'scale(0.98)';
            setTimeout(() => {
                img.src = item.src;
                img.style.opacity = '1';
                img.style.transform = 'scale(1)';
            }, 50);

            counter.innerText = `${currentLightboxIndex + 1} / ${currentItems.length}`;
            btnPrev.style.display = currentItems.length > 1 ? 'flex' : 'none';
            btnNext.style.display = currentItems.length > 1 ? 'flex' : 'none';
        }

        function navigateLightbox(delta) {
            const visibleProjectIds = getAllDescendantProjectIds(currentProjectId);
            const currentItems = allItems.filter(it => visibleProjectIds.includes(it.projectId));
            if (currentItems.length <= 1) return;

            currentLightboxIndex += delta;
            if (currentLightboxIndex < 0) {
                currentLightboxIndex = currentItems.length - 1;
            } else if (currentLightboxIndex >= currentItems.length) {
                currentLightboxIndex = 0;
            }

            updateLightboxDisplay();
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightboxModal') {
                document.getElementById('lightboxModal').classList.remove('active');
            }
        }

        function closeLightboxDirect() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        window.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightboxModal');
            if (modal && modal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    navigateLightbox(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateLightbox(1);
                } else if (e.key === 'Escape') {
                    closeLightboxDirect();
                }
            }
        });

        // 휠 넘김 제어
        let isWheelLocked = false;
        const lightboxModalEl = document.getElementById('lightboxModal');
        lightboxModalEl.addEventListener('wheel', (e) => {
            if (!lightboxModalEl.classList.contains('active')) return;
            e.preventDefault();

            if (isWheelLocked) return;

            if (e.deltaY > 20 || e.deltaX > 20) {
                navigateLightbox(1);
                lockWheelTemporarily();
            } else if (e.deltaY < -20 || e.deltaX < -20) {
                navigateLightbox(-1);
                lockWheelTemporarily();
            }
        }, { passive: false });

        function lockWheelTemporarily() {
            isWheelLocked = true;
            setTimeout(() => { isWheelLocked = false; }, 220);
        }

        async function promptAddUrl() {
            const urlInput = prompt("웹페이지 URL 또는 이미지 주소를 입력하세요:\n(예: https://dribbble.com/shots/... , https://pinterest.com/...)");
            if (!urlInput || !urlInput.trim()) return;

            const targetUrl = urlInput.trim();
            await fetchUrlAndAddSquareItem(targetUrl);
        }

        async function editItemUrl(id) {
            const item = allItems.find(it => it.id === id);
            if (!item) return;

            const currentUrl = item.url || '';
            const newUrl = prompt("이 이미지에 연결할 URL을 입력하세요 (비워두면 삭제):", currentUrl);
            
            if (newUrl !== null) {
                await db.collection('items').doc(id).update({
                    url: newUrl.trim()
                });
                showToast(newUrl.trim() ? "URL이 연결되었습니다." : "URL이 제거되었습니다.");
            }
        }

        function handleSizeChange(val) {
            const numVal = parseInt(val, 10);
            try {
                localStorage.setItem('moodboard_apple_size', val);
            } catch {}

            // 상단 슬라이더 조절 시 전체 카드들의 크기를 즉시 스케일링 조절
            const cards = document.querySelectorAll('.board-item');
            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                const item = allItems.find(it => it.id === id);
                if (item && item.customScale) {
                    // 개별 마우스 드래그로 조절했던 배율이 있으면 슬라이더 기준값에 맞춰 비례 스케일링
                    card.style.width = Math.round(numVal * item.customScale) + 'px';
                } else {
                    card.style.width = numVal + 'px';
                }
            });

            if (pckry) {
                pckry.layout();
            }
        }

        function initSlider() {
            try {
                const savedSize = localStorage.getItem('moodboard_apple_size');
                if (savedSize) {
                    const slider = document.getElementById('sizeSlider');
                    if (slider) {
                        slider.value = savedSize;
                        handleSizeChange(savedSize);
                    }
                }
            } catch {}
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }
    </script>
</body>
