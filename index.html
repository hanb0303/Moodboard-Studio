<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodboard Studio - Cloud Sync</title>
    <!-- SF Pro Display 느낌의 시스템 폰트 및 Lucide 아이콘 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK (완전 무료 Firestore만 사용) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Packery & imagesLoaded (자유 크기 조절 + 자석 밀착 테트리스 레이아웃 엔진) -->
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script src="https://unpkg.com/packery@2/dist/packery.pkgd.min.js"></script>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css");

        :root {
            --bg-primary: #000000;
            --bg-sidebar: rgba(18, 18, 20, 0.75);
            --bg-topbar: rgba(20, 20, 24, 0.7);
            --bg-card: #16161a;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --apple-blue: #2997ff;
            --apple-blue-hover: #0077ed;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --text-tertiary: #6e6e73;
            --glass-blur: blur(28px) saturate(190%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: "Wanted Sans Variable", "Wanted Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: "Wanted Sans Variable", "Wanted Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            letter-spacing: -0.015em;
        }

        /* 애플 스타일 사이드바 */
        aside.sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 50;
            transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), margin-left 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }

        aside.sidebar.collapsed {
            width: 0;
            margin-left: -1px;
            border-right: none;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 20px 18px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 260px;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cloud-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #30d158;
            background: rgba(48, 209, 88, 0.12);
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-add-proj {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-add-proj:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .project-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 260px;
        }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
            position: relative;
            user-select: none;
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .project-item.active {
            background: rgba(255, 255, 255, 0.14);
            font-weight: 500;
        }

        .project-item.depth-1 {
            padding-left: 24px;
            font-size: 12.5px;
            color: #d1d1d6;
        }

        .project-item.depth-2 {
            padding-left: 38px;
            font-size: 12px;
            color: #a1a1a6;
        }

        /* 폴더 드래그 앤 드롭 시각 피드백 */
        .project-item.is-dragging {
            opacity: 0.35;
            background: rgba(41, 151, 255, 0.15);
        }

        .project-item.drag-over-top {
            box-shadow: 0 -2px 0 0 #2997ff;
        }

        .project-item.drag-over-bottom {
            box-shadow: 0 2px 0 0 #2997ff;
        }

        .drag-handle {
            color: var(--text-tertiary);
            opacity: 0;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 2px;
            transition: opacity 0.15s ease;
            flex-shrink: 0;
        }

        .project-item:hover .drag-handle {
            opacity: 0.6;
        }
        .drag-handle:hover {
            opacity: 1 !important;
            color: #fff;
        }

        .tree-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            transition: transform 0.18s ease, color 0.15s;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .tree-toggle-btn:hover {
            color: #ffffff;
        }

        .tree-toggle-btn.collapsed {
            transform: rotate(-90deg);
        }

        .tree-toggle-placeholder {
            width: 16px;
            height: 16px;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .proj-name-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .proj-count {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 400;
            margin-right: 4px;
        }

        .proj-hover-tools {
            display: none;
            align-items: center;
            gap: 4px;
        }

        .project-item:hover .proj-hover-tools {
            display: flex;
        }

        .tool-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }
        .tool-icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }
        .tool-icon-btn.danger:hover {
            color: #ff453a;
        }

        .sidebar-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border-subtle);
            min-width: 260px;
        }

        .sidebar-trash-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .sidebar-trash-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .sidebar-trash-btn.active {
            background: rgba(255, 69, 58, 0.15);
            color: #ff453a;
            font-weight: 600;
        }

        .trash-badge {
            font-size: 11px;
            color: var(--text-tertiary);
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
        }

        /* 메인 뷰포트 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* 탑바 */
        header.topbar {
            height: 56px;
            background: var(--bg-topbar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 40;
        }

        .current-proj-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-sidebar-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.14);
            color: var(--text-primary);
        }

        /* 공유 전용 뷰어 모드 배너 */
        .share-mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(41, 151, 255, 0.15);
            border: 1px solid rgba(41, 151, 255, 0.3);
            color: #2997ff;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: -0.01em;
        }

        /* 애플 스타일 하위 폴더 탭 바 (Segmented Tabs) */
        .subfolder-tabs-bar {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 24px;
            background: rgba(14, 14, 18, 0.65);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-subtle);
            overflow-x: auto;
            flex-shrink: 0;
            z-index: 35;
        }

        .subfolder-tabs-bar::-webkit-scrollbar {
            height: 4px;
        }
        .subfolder-tabs-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .subfolder-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .subfolder-tab:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .subfolder-tab.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .subfolder-tab .tab-badge {
            font-size: 10.5px;
            opacity: 0.7;
            padding: 1px 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .subfolder-tab.active .tab-badge {
            background: rgba(255, 255, 255, 0.2);
            opacity: 1;
        }

        .subfolder-tab.drag-over {
            background: rgba(41, 151, 255, 0.35) !important;
            border-color: #2997ff !important;
            color: #ffffff !important;
            transform: scale(1.06);
            box-shadow: 0 0 12px rgba(41, 151, 255, 0.5);
        }

        .project-item.drag-over-folder {
            background: rgba(41, 151, 255, 0.25) !important;
            border-color: #2997ff !important;
            color: #2997ff !important;
        }

        .current-proj-info h2 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .count-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .topbar-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .slider-icon {
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .apple-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .apple-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .apple-btn.danger {
            color: #ff453a;
        }
        .apple-btn.danger:hover {
            background: rgba(255, 69, 58, 0.2);
        }

        /* 다중 선택 모드 */
        .board-item.selectable {
            cursor: pointer;
        }

        .board-item.selected {
            outline: 3px solid #2997ff;
            outline-offset: -3px;
        }

        .select-checkbox {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 15;
            transition: all 0.15s ease;
        }

        .selection-mode .select-checkbox {
            display: flex;
        }

        .board-item.selected .select-checkbox {
            background: #2997ff;
            border-color: #2997ff;
        }

        .board-item.selected .select-checkbox::after {
            content: "";
            width: 6px;
            height: 10px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        /* Packery 자석 밀착 테트리스 그리드 컨테이너 */
        .content-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .masonry-grid {
            position: relative;
            width: 100%;
            margin: 0 auto;
            transition: height 0.2s ease;
        }

        .board-item {
            position: absolute;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
            cursor: grab;
            user-select: none;
        }

        .board-item:active {
            cursor: grabbing;
        }

        .board-item.is-dragging {
            opacity: 0.25;
            transform: scale(0.96);
        }

        .board-item.drag-over-top {
            box-shadow: 0 -3px 0 0 #2997ff, 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .board-item.drag-over-bottom {
            box-shadow: 0 3px 0 0 #2997ff, 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .board-item.drag-over-left {
            box-shadow: 0 -3px 0 0 #2997ff, 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .board-item.drag-over-right {
            box-shadow: 0 3px 0 0 #2997ff, 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .board-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            border-color: var(--border-hover);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            display: flex;
            background: #0d0d0f;
        }

        .img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .img-wrapper.is-square {
            aspect-ratio: 1 / 1 !important;
            width: 100% !important;
            height: auto !important;
            position: relative !important;
        }

        .img-wrapper.is-square img {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .board-item:hover .img-wrapper img {
            transform: scale(1.02);
        }

        .card-url-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #2997ff;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            max-width: calc(100% - 16px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            z-index: 10;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .card-url-tag:hover {
            background: rgba(41, 151, 255, 0.2);
            color: #64b5f6;
            border-color: rgba(41, 151, 255, 0.4);
        }

        .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .board-item:hover .card-actions {
            opacity: 1;
        }

        .glass-icon-btn {
            width: 28px;
            height: 28px;
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 7px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .glass-icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .glass-icon-btn.danger:hover {
            background: rgba(255, 69, 58, 0.8);
            border-color: #ff453a;
        }

        /* 개별 이미지 크기 조절 모서리 영역 (우측 하단) */
        .resize-handle {
            position: absolute;
            width: 28px;
            height: 28px;
            bottom: 0;
            right: 0;
            cursor: nwse-resize;
            z-index: 25;
            user-select: none;
            background: transparent;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            border-right: 2px solid rgba(255, 255, 255, 0.35);
            border-bottom: 2px solid rgba(255, 255, 255, 0.35);
            border-bottom-right-radius: 2px;
            opacity: 0;
            transition: opacity 0.2s ease, border-color 0.2s ease;
            pointer-events: none;
        }

        .board-item:hover .resize-handle::after {
            opacity: 1;
        }

        .resize-handle:hover::after {
            border-color: #2997ff;
            opacity: 1;
        }

        .board-item.is-resizing {
            box-shadow: 0 0 0 2px #2997ff, 0 16px 40px rgba(0, 0, 0, 0.8) !important;
            user-select: none;
            cursor: nwse-resize !important;
        }

        .board-item.is-resizing * {
            user-select: none;
            pointer-events: none;
        }

        .resize-tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #2997ff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(41, 151, 255, 0.3);
            white-space: nowrap;
            pointer-events: none;
            z-index: 30;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px;
            text-align: center;
            color: var(--text-tertiary);
        }

        .empty-state h3 {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* 라이트박스 */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            cursor: zoom-out;
            user-select: none;
        }

        .lightbox-counter {

<body>

            <div class="topbar-controls">

    <!-- 라이트박스 -->

    <script>
        // --- 1. Firebase 초기화 설정 ---
        const firebaseConfig = {
            apiKey: "AIzaSyD2HQZe647qN3Knnn2JghkX9bb8I8Y18qE",
            authDomain: "moodboard-b51ff.firebaseapp.com",
            projectId: "moodboard-b51ff",
            storageBucket: "moodboard-b51ff.firebasestorage.app",
            messagingSenderId: "43409864736",
            appId: "1:43409864736:web:bf044bab27f27ee6996445"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 상태 변수
        let projects = [
            { id: 'proj-mobility', name: '강릉 모빌리티 LED', parentId: null },
            { id: 'proj-mobility-arch', name: '게이트 아치 시안', parentId: 'proj-mobility' },
            { id: 'proj-mobility-3d', name: '3D 오브젝트 레퍼런스', parentId: 'proj-mobility' },
            { id: 'proj-inspiration', name: 'UI / 비주얼 레퍼런스', parentId: null }
        ];
        let currentProjectId = 'proj-mobility';
        let allItems = [];
        let undoStack = [];
        let isSelectionMode = false;
        let selectedItemIds = new Set();
        let currentLightboxIndex = 0;
        let collapsedProjects = new Set();
        let isSidebarCollapsed = false;
        let isShareMode = false;
        let shareFolderId = null;
        let pckry = null;

        // 폴더 공유 링크 복사 함수
        function copyFolderShareLink(projectId) {
            const targetId = projectId || currentProjectId;
            const targetProj = projects.find(p => p.id === targetId);
            const projName = targetProj ? targetProj.name : '폴더';
            
            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('share', targetId);
            const shareUrl = currentUrl.toString();

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast(`🔗 [${projName}] 전용 공유 링크가 복사되었습니다!`);
                }).catch(() => {
                    fallbackCopyText(shareUrl, projName);
                });
            } else {
                fallbackCopyText(shareUrl, projName);
            }
        }

        function fallbackCopyText(text, projName) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`🔗 [${projName}] 전용 공유 링크가 복사되었습니다!`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            // URL 파라미터에서 ?share=... 확인
            const urlParams = new URLSearchParams(window.location.search);
            shareFolderId = urlParams.get('share');
            if (shareFolderId) {
                isShareMode = true;
                currentProjectId = shareFolderId;

                // 공유 뷰어 모드 UI 세팅: 사이드바 숨김, 읽기 전용 뱃지 표시, 수정/업로드/공유 버튼 숨김
                const sidebar = document.querySelector('aside.sidebar');
                if (sidebar) sidebar.classList.add('collapsed');

                const btnSidebarToggle = document.getElementById('btnSidebarToggle');
                if (btnSidebarToggle) btnSidebarToggle.style.display = 'none';

                const shareBadge = document.getElementById('shareModeBadgeContainer');
                if (shareBadge) shareBadge.style.display = 'block';

                const btnAddUrl = document.getElementById('btnAddUrl');
                if (btnAddUrl) btnAddUrl.style.display = 'none';

                const btnUpload = document.getElementById('btnUpload');
                if (btnUpload) btnUpload.style.display = 'none';

                const btnTrash = document.getElementById('btnTrash');
                if (btnTrash) btnTrash.style.display = 'none';

                const btnShareFolder = document.getElementById('btnShareFolder');
                if (btnShareFolder) btnShareFolder.style.display = 'none';
            }

            initSlider();
            if (!isShareMode) {
                setupPasteListener();
                setupUndoListener();
            }
            initRealtimeSync(); // Firebase 실시간 동기화 시작
        });

        // --- 2. Firebase 실시간 리스너 (어디서나 자동 동기화) ---
        function initRealtimeSync() {
            showToast("☁️ 클라우드 동기화 연결 중...");

            // 1) 폴더(프로젝트) 실시간 동기화
            db.collection('projects').onSnapshot((snapshot) => {
                if (!snapshot.empty) {
                    projects = [];
                    snapshot.forEach(doc => {
                        projects.push({ id: doc.id, ...doc.data() });
                    });
                } else {
                    // 최초 실행 시 기본 폴더 클라우드에 생성
                    projects.forEach(p => {
                        db.collection('projects').doc(p.id).set(p);
                    });
                }

                if (!isShareMode && !projects.some(p => p.id === currentProjectId)) {
                    currentProjectId = projects[0]?.id || 'proj-mobility';
                }
                renderProjects();
                renderSubfolderTabs();
                renderGrid();
            }, (error) => {
                console.error("Firestore Projects sync error:", error);
            });

            // 2) 이미지 아이템 실시간 동기화 (최신순)
            db.collection('items').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                allItems = [];
                snapshot.forEach(doc => {
                    allItems.push({ id: doc.id, ...doc.data() });
                });
                // 7일 지난 휴지통 항목 자동 정리
                cleanUpOldTrashItems();
                renderProjects();
                renderSubfolderTabs();
                renderGrid();
                showToast("☁️ 클라우드 동기화 완료");
            }, (error) => {
                console.error("Firestore Items sync error:", error);
            });

            // 로컬 UI 상태 복원 (공유 모드가 아닐 때만)
            if (!isShareMode) {
                const savedSidebar = localStorage.getItem('moodboard_sidebar_collapsed');
                if (savedSidebar === '1') {
                    isSidebarCollapsed = true;
                    const sb = document.querySelector('aside.sidebar');
                    if (sb) sb.classList.add('collapsed');
                }
                const savedCollapsed = localStorage.getItem('moodboard_collapsed_projects');
                if (savedCollapsed) {
                    collapsedProjects = new Set(JSON.parse(savedCollapsed));
                }
            }
        }

        // --- 3. 이미지 압축 헬퍼 (Firestore 무료 저장용 - 100% 완전 무료) ---
        function compressImage(base64Data, maxWidth = 1600, quality = 0.85) {
            return new Promise((resolve) => {
                if (!base64Data || !base64Data.startsWith('data:image')) {
                    resolve(base64Data);
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    resolve(compressedBase64);
                };
                img.onerror = () => resolve(base64Data);
                img.src = base64Data;
            });
        }

        // 아이템 추가 (Firestore에 실시간 직접 저장 - 카드 결제/Storage 전혀 불필요)
        async function addNewItem(item) {
            showToast("☁️ 클라우드 저장 중...");
            try {
                let finalSrc = item.src;
                if (typeof item.src === 'string' && item.src.startsWith('data:image')) {
                    finalSrc = await compressImage(item.src);
                }

                const docData = {
                    projectId: item.projectId,
                    src: finalSrc,
                    url: item.url || '',
                    isSquare: item.isSquare || false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                const docRef = await db.collection('items').add(docData);
                undoStack.push({ type: 'add', itemId: docRef.id });
                showToast("✨ 클라우드에 저장되었습니다.");
            } catch (err) {
                console.error("Save error:", err);
                showToast("⚠️ 저장 중 오류: Firestore 보안 규칙을 확인하세요.");
            }
        }

        // 폴더/하위폴더 트리 계산
        function getAllDescendantProjectIds(rootId) {
            const result = [rootId];
            function findChildren(pId) {
                const children = projects.filter(p => p.parentId === pId);
                children.forEach(c => {
                    result.push(c.id);
                    findChildren(c.id);
                });
            }
            findChildren(rootId);
            return result;
        }

        function getProjectImageCount(pId) {
            const allTargetIds = getAllDescendantProjectIds(pId);
            return allItems.filter(item => allTargetIds.includes(item.projectId)).length;
        }

        let draggedProjectId = null;

        function renderProjects() {
            const list = document.getElementById('projectList');
            if (!list) return;
            list.innerHTML = '';

            // order 기준 정렬
            projects.sort((a, b) => (a.order || 0) - (b.order || 0));

            const rootProjects = projects.filter(p => !p.parentId || !projects.some(parent => parent.id === p.parentId));

            function renderProjectTree(p, depth = 0) {
                const isSelected = p.id === currentProjectId;
                const totalCount = getProjectImageCount(p.id);
                const children = projects.filter(child => child.parentId === p.id);
                const hasChildren = children.length > 0;
                const isCollapsed = collapsedProjects.has(p.id);

                const itemEl = document.createElement('div');
                itemEl.className = `project-item depth-${depth} ${isSelected ? 'active' : ''}`;
                itemEl.setAttribute('draggable', 'true');
                itemEl.setAttribute('data-id', p.id);
                itemEl.onclick = () => selectProject(p.id);

                // --- 드래그 앤 드롭 이벤트 ---
                itemEl.addEventListener('dragstart', (e) => {
                    draggedProjectId = p.id;
                    itemEl.classList.add('is-dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', p.id);
                });

                itemEl.addEventListener('dragend', () => {
                    draggedProjectId = null;
                    document.querySelectorAll('.project-item').forEach(el => {
                        el.classList.remove('is-dragging', 'drag-over-top', 'drag-over-bottom');
                    });
                });

                itemEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedItemId) {
                        e.dataTransfer.dropEffect = 'move';
                        itemEl.classList.add('drag-over-folder');
                        return;
                    }

                    if (!draggedProjectId || draggedProjectId === p.id) return;
                    e.dataTransfer.dropEffect = 'move';

                    const rect = itemEl.getBoundingClientRect();
                    const midY = rect.top + rect.height / 2;
                    if (e.clientY < midY) {
                        itemEl.classList.add('drag-over-top');
                        itemEl.classList.remove('drag-over-bottom');
                    } else {
                        itemEl.classList.add('drag-over-bottom');
                        itemEl.classList.remove('drag-over-top');
                    }
                });

                itemEl.addEventListener('dragleave', () => {
                    itemEl.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-folder');
                });

                itemEl.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    itemEl.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-folder');
                    
                    if (draggedItemId) {
                        await moveItemToFolder(draggedItemId, p.id);
                        return;
                    }

                    if (!draggedProjectId || draggedProjectId === p.id) return;

                    const rect = itemEl.getBoundingClientRect();
                    const isInsertBefore = e.clientY < (rect.top + rect.height / 2);

                    await handleProjectReorder(draggedProjectId, p.id, isInsertBefore);
                });

                itemEl.ondblclick = (e) => {
                    e.stopPropagation();
                    promptRenameProject(p.id);
                };

                itemEl.innerHTML = `
                    <div class="proj-name-wrap">
                        ${hasChildren ? `
                            <button class="tree-toggle-btn ${isCollapsed ? 'collapsed' : ''}" title="${isCollapsed ? '펼치기' : '접기'}" onclick="toggleFolderCollapse('${p.id}', event)">
                                <i data-lucide="chevron-down" style="width: 13px; height: 13px;"></i>
                            </button>
                        ` : `
                            <span class="tree-toggle-placeholder"></span>
                        `}
                        <i data-lucide="${isSelected ? 'folder-open' : 'folder'}" style="width: 14px; height: 14px; color: ${isSelected ? '#f5f5f7' : '#86868b'}; flex-shrink: 0;"></i>
                        <span title="더블클릭하여 이름 변경: ${p.name}">${p.name}</span>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="proj-count">${totalCount}</span>
                        <div class="proj-hover-tools" onclick="event.stopPropagation()">
                            <button class="tool-icon-btn" title="폴더 공유 링크 복사" onclick="copyFolderShareLink('${p.id}')">
                                <i data-lucide="share-2" style="width: 12px; height: 12px; color: #2997ff;"></i>
                            </button>
                            <button class="tool-icon-btn" title="하위 폴더 추가" onclick="promptAddSubProject('${p.id}')">
                                <i data-lucide="plus" style="width: 12px; height: 12px;"></i>
                            </button>
                            ${projects.length > 1 ? `
                                <button class="tool-icon-btn danger" title="폴더 삭제" onclick="deleteProject('${p.id}')">
                                    <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;

                list.appendChild(itemEl);

                if (hasChildren && !isCollapsed) {
                    children.forEach(child => renderProjectTree(child, depth + 1));
                }
            }

            rootProjects.forEach(rp => renderProjectTree(rp, 0));

            // 휴지통 뱃지 카운트 갱신 및 사이드바 버튼 상태
            const trashItemsCount = allItems.filter(it => it.projectId === 'trash').length;
            const trashBadge = document.getElementById('trashCountBadge');
            if (trashBadge) trashBadge.innerText = `${trashItemsCount}`;

            const trashBtn = document.getElementById('sidebarTrashBtn');
            if (trashBtn) {
                trashBtn.classList.toggle('active', currentProjectId === 'trash');
            }

            const isTrashView = currentProjectId === 'trash';
            const titleEl = document.getElementById('currentProjName');
            if (titleEl) {
                if (isTrashView) {
                    titleEl.innerText = '휴지통';
                } else {
                    const currentProj = projects.find(p => p.id === currentProjectId) || projects[0];
                    titleEl.innerText = currentProj ? currentProj.name : '';
                }
            }

            lucide.createIcons();
        }

        // 폴더 이름 변경
        async function promptRenameProject(pId) {
            const target = projects.find(p => p.id === pId);
            if (!target) return;

            const newName = prompt("변경할 폴더 이름을 입력하세요:", target.name);
            if (!newName || !newName.trim() || newName.trim() === target.name) return;

            target.name = newName.trim();
            renderProjects();

            try {
                await db.collection('projects').doc(pId).update({
                    name: target.name
                });
                showToast(`"${target.name}"(으)로 이름이 변경되었습니다.`);
            } catch (err) {
                console.error("Rename project error:", err);
            }
        }

        // 드래그 앤 드롭 순서 변경 처리
        async function handleProjectReorder(sourceId, targetId, isInsertBefore) {
            const sourceIndex = projects.findIndex(p => p.id === sourceId);
            const targetIndex = projects.findIndex(p => p.id === targetId);
            if (sourceIndex === -1 || targetIndex === -1) return;

            const [movedProject] = projects.splice(sourceIndex, 1);
            
            // 타겟 폴더와 동일한 레벨로 부모 parentId 맞춤
            const targetProject = projects.find(p => p.id === targetId);
            if (targetProject) {
                movedProject.parentId = targetProject.parentId;
            }

            const newTargetIndex = projects.findIndex(p => p.id === targetId);
            const insertIndex = isInsertBefore ? newTargetIndex : newTargetIndex + 1;
            projects.splice(insertIndex, 0, movedProject);

            // 전체 순서 order 인덱스 부여
            projects.forEach((p, idx) => {
                p.order = idx;
            });

            renderProjects();

            // Firestore에 변경된 순서 및 parentId 일괄 저장
            try {
                const batch = db.batch();
                projects.forEach(p => {
                    batch.set(db.collection('projects').doc(p.id), {
                        name: p.name,
                        parentId: p.parentId || null,
                        order: p.order
                    }, { merge: true });
                });
                await batch.commit();
                showToast("순서가 변경되었습니다.");
            } catch (err) {
                console.warn("Reorder save error:", err);
            }
        }

        function selectProject(id) {
            currentProjectId = id;
            if (isSelectionMode) toggleSelectMode(false);
            const normalCtrl = document.getElementById('normalControls');
            const trashCtrl = document.getElementById('trashControls');
            if (normalCtrl) normalCtrl.style.display = 'flex';
            if (trashCtrl) trashCtrl.style.display = 'none';

            renderProjects();
            renderSubfolderTabs();
            renderGrid();
        }

        function selectTrashView() {
            currentProjectId = 'trash';
            if (isSelectionMode) toggleSelectMode(false);
            const normalCtrl = document.getElementById('normalControls');
            const trashCtrl = document.getElementById('trashControls');
            if (normalCtrl) normalCtrl.style.display = 'none';
            if (trashCtrl) trashCtrl.style.display = 'flex';

            renderProjects();
            renderSubfolderTabs();
            renderGrid();
        }

        // 하위 폴더 탭 바 (Segmented Tabs) 렌더링
        function renderSubfolderTabs() {
            const tabsBar = document.getElementById('subfolderTabsBar');
            if (!tabsBar) return;

            const currentProj = projects.find(p => p.id === currentProjectId);
            if (!currentProj) {
                tabsBar.style.display = 'none';
                return;
            }

            // 현재 선택된 폴더가 루트(큰 폴더)인지, 아니면 하위 폴더인지 판단하여 부모 루트 찾기
            let parentRoot = currentProj;
            if (currentProj.parentId) {
                // 상위 부모 폴더 찾기
                let temp = currentProj;
                while (temp && temp.parentId) {
                    temp = projects.find(p => p.id === temp.parentId);
                }
                if (temp) parentRoot = temp;
            }

            // 해당 루트 폴더의 직속 하위 폴더들 검색
            const subfolders = projects.filter(p => p.parentId === parentRoot.id);

            // 하위 폴더가 없는 단독 폴더인 경우 탭 바 숨김
            if (subfolders.length === 0) {
                tabsBar.style.display = 'none';
                return;
            }

            // 하위 폴더가 있으면 탭 바 표시
            tabsBar.style.display = 'flex';
            tabsBar.innerHTML = '';

            // 1) "전체 (All)" 탭 - 상위 루트 폴더 선택
            const isAllActive = currentProjectId === parentRoot.id;
            const allCount = getProjectImageCount(parentRoot.id);

            const allTab = document.createElement('div');
            allTab.className = `subfolder-tab ${isAllActive ? 'active' : ''}`;
            allTab.innerHTML = `
                <i data-lucide="layers" style="width: 13px; height: 13px;"></i>
                <span>전체 (${parentRoot.name})</span>
                <span class="tab-badge">${allCount}</span>
            `;
            allTab.onclick = () => selectProject(parentRoot.id);

            // 이미지 드래그하여 루트 폴더로 이동
            allTab.addEventListener('dragover', (e) => {
                if (draggedItemId) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    allTab.classList.add('drag-over');
                }
            });
            allTab.addEventListener('dragleave', () => {
                allTab.classList.remove('drag-over');
            });
            allTab.addEventListener('drop', async (e) => {
                e.preventDefault();
                allTab.classList.remove('drag-over');
                if (draggedItemId) {
                    await moveItemToFolder(draggedItemId, parentRoot.id);
                }
            });

            tabsBar.appendChild(allTab);

            // 2) 각각의 개별 하위 폴더 탭들
            subfolders.forEach(sub => {
                const isSubActive = currentProjectId === sub.id;
                const subCount = getProjectImageCount(sub.id);

                const tab = document.createElement('div');
                tab.className = `subfolder-tab ${isSubActive ? 'active' : ''}`;
                tab.innerHTML = `
                    <i data-lucide="${isSubActive ? 'folder-open' : 'folder'}" style="width: 12px; height: 12px;"></i>
                    <span>${sub.name}</span>
                    <span class="tab-badge">${subCount}</span>
                `;
                tab.onclick = () => selectProject(sub.id);

                // 이미지 드래그하여 하위 폴더로 이동
                tab.addEventListener('dragover', (e) => {
                    if (draggedItemId) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        tab.classList.add('drag-over');
                    }
                });
                tab.addEventListener('dragleave', () => {
                    tab.classList.remove('drag-over');
                });
                tab.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    tab.classList.remove('drag-over');
                    if (draggedItemId) {
                        await moveItemToFolder(draggedItemId, sub.id);
                    }
                });

                tabsBar.appendChild(tab);
            });

            lucide.createIcons();
        }

        function toggleSidebar() {

        async function promptAddProject() {

            const name = prompt(`[${parent ? parent.name : '상위폴더'}] 내에 생성할 하위 폴더 이름:`);
